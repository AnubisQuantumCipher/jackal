name: Formal proof identity gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-proof-and-axioms:
    name: Gaussian/range source closures and axiom audits
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Lean toolchain and build formal checkers
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: proofs/lean
          auto-config: false
          build: true
          build-args: jackal_gaussian_check jackal_cert_check jackal_int_cert_check jackal_spacecraft_burn_check
          test: false

      - name: Verify proof identities and exact theorem axiom sets
        run: |
          cp proofs/lean/lakefile.toml "$RUNNER_TEMP/v174-lakefile.toml"
          cp release/compat/v173_lakefile.toml proofs/lean/lakefile.toml
          python3 release/tools/gaussian_proof_identity.py check --lane gaussian --proof-only
          python3 release/tools/range_proof_identity.py check --lane range --proof-only
          python3 release/tools/range_proof_identity.py check --lane int-cert --proof-only
          cp "$RUNNER_TEMP/v174-lakefile.toml" proofs/lean/lakefile.toml
          /usr/bin/python3 -I -B release/tools/spacecraft_burn_proof_identity.py check --proof-only

      - name: Reject repository-wide Lean admissions and trust bypasses
        run: |
          python3 -B tools/lean_admission_audit.py --source-check
          python3 -B -m unittest \
            tests.lean_admission_audit_test.LeanAdmissionAuditMutationTest -v

      # The committed checker hashes are for the recorded macOS/arm64 builds.
      # A release seal must additionally run the full, platform-matching gate:
      # python3 release/tools/gaussian_proof_identity.py check --lane gaussian
      # python3 release/tools/range_proof_identity.py check --lane range
      # python3 release/tools/range_proof_identity.py check --lane int-cert

  claim-kernel-admission:
    name: claim-kernel admission and surface locks (engine-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Mechanical 41-tool inventory and pack-reachability lock
        run: |
          python3 - <<'PY'
          import json
          tools = json.load(open("plugin/hermes/tools.json"))["tools"]
          names = sorted(t["name"] for t in tools)
          assert len(names) == 41, f"expected 41 tools, found {len(names)}"
          assert "jackal_claim" in names and "jackal_verify_bundle" in names
          assert "jackal_integrate_bound_cert" in names
          program_tools = {
              "jackal_anubis_check_program",
              "jackal_anubis_verify_program",
              "jackal_anubis_verify_program_receipt",
          }
          assert program_tools <= set(names), "program-evidence tool omission"
          # Every domain-pack operation must be reachable through some tool.
          # `core.exact.mod_pow.v1` routes to the `mod-pow` engine command that
          # `jackal_mod_pow` already exposes, so it is exempt BY NAME.
          registry = json.load(open("domain_packs/registry_v1.json"))
          blob = {t["name"]: json.dumps(t, sort_keys=True) for t in tools}
          exempt = {"core.exact.mod_pow.v1"}
          for pack in registry["packs"]:
              for op in pack["operation_ids"]:
                  if op in exempt:
                      continue
                  owners = sorted(n for n, x in blob.items() if op in x)
                  assert len(owners) == 1, f"{op} exposed by {owners}, expected 1"
          full = json.load(open("plugin/hermes/profiles/full.json"))["tools"]
          assert full == [t["name"] for t in tools], "full profile != tools.json order"
          print(f"41-tool inventory locked: {len(names)} tools; "
                f"{sum(len(p['operation_ids']) for p in registry['packs'])} "
                "pack operations reachable")
          PY

      - name: Canonical capability inventory
        run: |
          python3 -B -m unittest tests.capability_inventory_test -v
          python3 -B tools/capability_drift_gate.py
          python3 -B -m unittest tests.capability_drift_gate_test -v

      - name: v1.5.0 compatibility floor (additive-only surface lock)
        run: python3 tools/compat_floor.py --check

      - name: Claim-bundle admission replay and tamper refusal
        run: python3 release/tools/ci_claim_admission.py

      # Scope: this job replays the committed exact-lane claim fixture
      # through the dependency-free verifier with caller-supplied pins and
      # proves one semantic tamper refuses.  It does NOT run the macOS-only
      # engine, the Lean-checked formal lanes, or the full 43-gate local
      # aggregate — those are sealed locally and recorded in PROVENANCE.md.
