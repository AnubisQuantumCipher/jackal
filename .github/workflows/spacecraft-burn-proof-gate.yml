name: Spacecraft burn formal certificate gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-certificate-campaign:
    # The published checker identity and verifier archive are macOS/arm64.
    # Ubuntu independently builds/audits the Lean source closure in
    # gaussian-proof-gate.yml, but does not claim executable-byte parity.
    runs-on: macos-14
    timeout-minutes: 45
    env:
      MODEL_ID: jackal-spacecraft-finite-burn-ode-v2
      RELEASE_EPOCH: v1.7.4
      REQUEST_DIGEST: 03bcad618ad60114007c74a384eb8c9432e3755b817e74bd5bdc9bd1ba6df3e7
      PUBLICATION_NONCE: spacecraft-burn-v2-publication-20260824
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Lean toolchain and build spacecraft checker
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: proofs/lean
          auto-config: false
          build: true
          build-args: jackal_spacecraft_burn_check
          test: false

      - name: Verify source proof closure and admission boundary
        run: |
          python3 -B release/tools/spacecraft_burn_proof_identity.py check --proof-only
          python3 -B tools/lean_admission_audit.py --source-check
          python3 -B -m unittest tests.spacecraft_burn_proof_identity_test -v

      - name: Run spacecraft unit and claim-surface gates
        run: |
          python3 -B -m unittest discover -s spacecraft_burn_cert/tests -p 'test_*.py' -v
          python3 -B -m unittest tests.spacecraft_burn_release_gate_test tests.spacecraft_burn_workflow_test -v
          python3 -B tools/spacecraft_burn_release_gate.py

      - name: Generate platform-local proof identity and exact pins
        run: |
          mkdir -p "$RUNNER_TEMP/spacecraft-v2/run-a" "$RUNNER_TEMP/spacecraft-v2/run-b"
          echo "RUN_A=$RUNNER_TEMP/spacecraft-v2/run-a" >> "$GITHUB_ENV"
          echo "RUN_B=$RUNNER_TEMP/spacecraft-v2/run-b" >> "$GITHUB_ENV"
          python3 -B release/tools/spacecraft_burn_proof_identity.py generate \
            --output "$RUNNER_TEMP/spacecraft-v2/proof_identity.json"
          echo "PROOF_FILE_SHA=$(python3 -c 'import hashlib,os; print(hashlib.sha256(open(os.environ["RUNNER_TEMP"]+"/spacecraft-v2/proof_identity.json","rb").read()).hexdigest())')" >> "$GITHUB_ENV"
          echo "PROOF_IDENTITY_SHA=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/spacecraft-v2/proof_identity.json"))["identity_digest_sha256"])')" >> "$GITHUB_ENV"

      - name: Generate and formally check the complete witness
        run: |
          if ! python3 -B spacecraft_burn_cert/certify.py \
            --output "$RUN_A/baseline_receipt_v2.json" \
            --witness "$RUN_A/baseline_witness_v2.cert" \
            --checker proofs/lean/.lake/build/bin/jackal_spacecraft_burn_check \
            --proof-identity "$RUNNER_TEMP/spacecraft-v2/proof_identity.json" \
            --request-digest "$REQUEST_DIGEST" --model-id "$MODEL_ID" \
            --epoch "$RELEASE_EPOCH" --nonce "$PUBLICATION_NONCE"; then
            set +e
            proofs/lean/.lake/build/bin/jackal_spacecraft_burn_check \
              "$RUN_A/baseline_witness_v2.cert" "$REQUEST_DIGEST" \
              "$MODEL_ID" "$RELEASE_EPOCH"
            checker_status=$?
            set -e
            echo "diagnostic checker exit status: $checker_status" >&2
            exit 1
          fi
          echo "RECEIPT_SHA=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$RUN_A/baseline_receipt_v2.json")" >> "$GITHUB_ENV"

      - name: Independently replay checker, interval chain, and validations
        run: |
          python3 -B spacecraft_burn_cert/verify_receipt.py \
            "$RUN_A/baseline_receipt_v2.json" \
            --source spacecraft_burn_cert/certify.py \
            --witness "$RUN_A/baseline_witness_v2.cert" \
            --checker proofs/lean/.lake/build/bin/jackal_spacecraft_burn_check \
            --proof-identity "$RUNNER_TEMP/spacecraft-v2/proof_identity.json" \
            --expected-receipt-sha256 "$RECEIPT_SHA" \
            --expected-proof-file-sha256 "$PROOF_FILE_SHA" \
            --expected-proof-identity-sha256 "$PROOF_IDENTITY_SHA" \
            --expected-request-digest "$REQUEST_DIGEST" --expected-model-id "$MODEL_ID" \
            --expected-epoch "$RELEASE_EPOCH" --nonce "$PUBLICATION_NONCE" \
            --output "$RUN_A/independent_verification_v2.json"
          python3 -B spacecraft_burn_cert/validate.py \
            --baseline "$RUN_A/baseline_receipt_v2.json" \
            --output "$RUN_A/instrument_validation_v2.json"

      - name: Run source and witness mutation A-B-A campaign
        run: |
          python3 -B spacecraft_burn_cert/mutation_aba.py \
            --baseline "$RUN_A/baseline_receipt_v2.json" \
            --witness "$RUN_A/baseline_witness_v2.cert" \
            --checker proofs/lean/.lake/build/bin/jackal_spacecraft_burn_check \
            --proof-identity "$RUNNER_TEMP/spacecraft-v2/proof_identity.json" \
            --expected-receipt-sha256 "$RECEIPT_SHA" \
            --expected-proof-file-sha256 "$PROOF_FILE_SHA" \
            --expected-proof-identity-sha256 "$PROOF_IDENTITY_SHA" \
            --expected-request-digest "$REQUEST_DIGEST" --expected-model-id "$MODEL_ID" \
            --expected-epoch "$RELEASE_EPOCH" --nonce "$PUBLICATION_NONCE" \
            --output "$RUN_A/mutation_aba_v2.json"

      - name: Reproduce evidence manifests from exact staged bytes
        run: |
          python3 -B spacecraft_burn_cert/release_evidence.py \
            --staging-dir "$RUN_A" \
            --evidence-dir "$RUNNER_TEMP/spacecraft-v2/reproduced-evidence" \
            --include-witness
          python3 -B spacecraft_burn_cert/release_evidence.py \
            --staging-dir "$RUN_A" \
            --evidence-dir "$RUNNER_TEMP/spacecraft-v2/reproduced-evidence" \
            --include-witness --check

      - name: Reproduce full witness and receipt byte for byte
        run: |
          python3 -B spacecraft_burn_cert/certify.py \
            --output "$RUN_B/baseline_receipt_v2.json" \
            --witness "$RUN_B/baseline_witness_v2.cert" \
            --checker proofs/lean/.lake/build/bin/jackal_spacecraft_burn_check \
            --proof-identity "$RUNNER_TEMP/spacecraft-v2/proof_identity.json" \
            --request-digest "$REQUEST_DIGEST" --model-id "$MODEL_ID" \
            --epoch "$RELEASE_EPOCH" --nonce "$PUBLICATION_NONCE"
          cmp -s "$RUN_A/baseline_witness_v2.cert" "$RUN_B/baseline_witness_v2.cert"
          cmp -s "$RUN_A/baseline_receipt_v2.json" "$RUN_B/baseline_receipt_v2.json"

      - name: Upload bounded evidence logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spacecraft-burn-evidence-macos-14-${{ github.sha }}
          path: |
            ${{ runner.temp }}/spacecraft-v2/**/*.json
          if-no-files-found: error
          retention-days: 14
