name = "jackal-iv"
defaultTargets = ["JackalIv"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0"

[[lean_lib]]
name = "JackalIv"

[[lean_exe]]
name = "jackal_parse_dump"
root = "JackalIv.ParseDumpMain"

[[lean_exe]]
name = "jackal_cert_check"
root = "JackalIv.CertCheckMain"

[[lean_exe]]
name = "jackal_gaussian_check"
root = "JackalIv.GaussianCertMain"
